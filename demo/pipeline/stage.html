<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WhatToEat demo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root { --cream:#FBF4E6; --ink:#10372B; --lime:#C6E34A; --turmeric:#F5B50F; --chilli:#E8412C; --blush:#FFB8C9; --cobalt:#2D4BFF; --muted:#5B6E66; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--cream); font-family:'Inter Tight', sans-serif; color:var(--ink); }
  * { box-sizing:border-box; }
  .abs { position:absolute; }
  #wall img { position:absolute; opacity:.18; }
  #phone { position:absolute; left:371.5px; top:60px; width:457px; height:960px; border-radius:72px; overflow:hidden; box-shadow:0 34px 70px rgba(16,55,43,.22); opacity:0; }
  .layer { position:absolute; left:-12.6px; top:-24.11px; width:482.2px; height:1008.2px; }
  #zoomclip { position:absolute; left:13.15px; top:13.15px; width:430.7px; height:933.7px; border-radius:59px; overflow:hidden; display:none; }
  #zoominner { position:absolute; left:-13.15px; top:-13.15px; width:457px; height:960px; }

  .pill { position:absolute; left:1080px; top:120px; transform:translateY(-50%); background:var(--turmeric); border:3px solid var(--ink); border-radius:999px; padding:12px 24px; font-weight:800; font-size:26px; letter-spacing:-0.5px; white-space:nowrap; opacity:0; }

  .card { position:absolute; left:1080px; width:720px; opacity:0; }
  .card .block { position:absolute; inset:0; background:var(--lime); border:4px solid var(--ink); border-radius:28px; }
  .card .face { position:relative; background:#fff; border:4px solid var(--ink); border-radius:28px; padding:28px 36px 30px; }
  .card h1 { margin:0; font-size:52px; font-weight:900; letter-spacing:-1.5px; line-height:1.05; }
  .card h1 b { color:var(--chilli); font-weight:900; }
  .card p { margin:12px 0 0; font-size:28px; font-weight:600; color:var(--muted); letter-spacing:-0.3px; line-height:1.2; }
  .spark { position:absolute; width:34px; height:34px; opacity:0; }

  #bubble { position:absolute; left:1080px; top:722px; width:720px; background:var(--cobalt); border:4px solid var(--ink); border-radius:28px; padding:22px 30px 24px 82px; color:#fff; font-weight:700; font-size:32px; line-height:1.28; letter-spacing:-0.3px; opacity:0; transform-origin:0 50%; }
  #bubble .mic { position:absolute; left:26px; top:24px; width:36px; height:36px; }
  #bubble .tail { position:absolute; left:-27px; top:34px; width:30px; height:30px; }
  #bubble .w { opacity:0; transition:none; }

  .tag { position:absolute; left:868px; transform:translateY(-50%); background:#fff; border:3px solid var(--ink); border-radius:999px; padding:8px 18px; font-weight:700; font-size:22px; white-space:nowrap; opacity:0; }
  #lines { position:absolute; left:0; top:0; }

  #title, #endc { position:absolute; inset:0; }
  .badge { position:absolute; width:360px; height:360px; left:780px; top:150px; }
  .word { position:absolute; left:0; width:1920px; top:560px; text-align:center; font-weight:900; font-size:120px; letter-spacing:-4px; line-height:1; }
  .tpill { position:absolute; top:735px; left:50%; transform:translateX(-50%); background:var(--turmeric); border:3px solid var(--ink); border-radius:999px; padding:14px 30px; font-weight:800; font-size:32px; letter-spacing:-0.5px; white-space:nowrap; }
  .upill { position:absolute; top:845px; left:50%; transform:translateX(-50%); background:#fff; border:3px solid var(--ink); border-radius:999px; padding:12px 28px; font-weight:700; font-size:28px; white-space:nowrap; }
  #parade img { position:absolute; }
  #fade { position:absolute; inset:0; background:var(--cream); opacity:0; }
</style>
</head>
<body>
<div id="wall"></div>
<div id="phone">
  <img class="layer" id="b0"><img class="layer" id="b1">
  <div id="zoomclip"><div id="zoominner"><img class="layer" id="z0"><img class="layer" id="z1"></div></div>
</div>
<div id="pills"></div>
<div id="cards"></div>
<div id="bubble">
  <svg class="tail" viewBox="0 0 30 30"><path d="M28 3 L3 15 L28 27 Z" fill="#2D4BFF" stroke="#10372B" stroke-width="4" stroke-linejoin="round"/><rect x="26" y="0" width="6" height="30" fill="#2D4BFF"/></svg>
  <svg class="mic" viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg>
  <span id="btext"></span>
</div>
<svg id="lines" width="1920" height="1080"></svg>
<div id="tags"></div>
<svg id="rings" class="abs" width="1920" height="1080" style="left:0;top:0"></svg>
<div id="title"></div>
<div id="endc"></div>
<div id="parade"></div>
<div id="fade"></div>
<script>
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeBack = (x) => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const S = 960 / 963.6;                       // raw device px -> stage px
const PX = 371.5, PY = 60;                   // phone frame origin on the stage
const local = (dx, dy) => [-12.6 + dx * S, -24.11 + dy * S];   // raw device px -> phone-local px
let C = null;                                 // config from the renderer
let rng = 7;
const rand = () => { rng = (rng * 16807) % 2147483647; return (rng - 1) / 2147483646; };

window.setup = async (config) => {
  C = config;
  // Doodle wallpaper, like the app's: faint, scattered, gently rotated.
  const wall = $('#wall');
  const cols = 9, rows = 5;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (rand() < 0.22) continue;
    const img = document.createElement('img');
    const size = 120 + rand() * 50;
    img.src = C.doodles[Math.floor(rand() * C.doodles.length)];
    img.style.width = img.style.height = size + 'px';
    img.style.left = (c * 1920 / cols + rand() * (1920 / cols - size * 0.6)) + 'px';
    img.style.top = (r * 1080 / rows + rand() * (1080 / rows - size * 0.6) - 20) + 'px';
    img.style.transform = `rotate(${(rand() - 0.5) * 36}deg)`;
    wall.appendChild(img);
  }
  // Scene pills
  for (const p of C.pills) {
    const el = document.createElement('div'); el.className = 'pill'; el.textContent = p.text; p.el = el; $('#pills').appendChild(el);
  }
  // Headline cards (+ sparkles)
  for (const h of C.cards) {
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="block"></div><div class="face"><h1>${h.html}</h1>${h.sub ? `<p>${h.sub}</p>` : ''}</div>`;
    $('#cards').appendChild(el); h.el = el;
    if (h.sparkles) {
      h.sparks = [['#C6E34A', -20, -22, 1], ['#FFB8C9', 1, -26, 0.8], ['#F5B50F', 1, 1, 0.9]].map(([fill, ax, ay, sc]) => {
        const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        s.setAttribute('viewBox', '0 0 40 40'); s.setAttribute('class', 'spark');
        s.innerHTML = `<path d="M20 2 C22 14 26 18 38 20 C26 22 22 26 20 38 C18 26 14 22 2 20 C14 18 18 14 20 2 Z" fill="${fill}" stroke="#10372B" stroke-width="3" stroke-linejoin="round"/>`;
        el.appendChild(s); return { s, ax, ay, sc };
      });
    }
  }
  // Pointer tags
  for (const d of C.tags) {
    const el = document.createElement('div'); el.className = 'tag'; el.textContent = d.text; $('#tags').appendChild(el); d.el = el;
    const ns = 'http://www.w3.org/2000/svg';
    d.line = document.createElementNS(ns, 'line'); d.line.setAttribute('stroke', '#10372B'); d.line.setAttribute('stroke-width', '2.5');
    d.dot = document.createElementNS(ns, 'circle'); d.dot.setAttribute('r', '7'); d.dot.setAttribute('fill', '#C6E34A'); d.dot.setAttribute('stroke', '#10372B'); d.dot.setAttribute('stroke-width', '2.5');
    $('#lines').appendChild(d.line); $('#lines').appendChild(d.dot);
  }
  // Title and end cards
  $('#title').innerHTML = `<img class="badge" src="${C.badge}"><div class="word">WhatToEat</div><div class="tpill">Decide what to eat in 60 seconds</div>`;
  $('#endc').innerHTML = `<img class="badge" src="${C.badge}"><div class="word">WhatToEat</div><div class="tpill">Cook · Order in · Dine out</div><div class="upill">mosaic-seven-henna.vercel.app</div>`;
  // Doodle parades
  C.paradeEls = C.parades.map((w) => w.doodles.map((src) => {
    const img = document.createElement('img'); img.src = src; img.style.display = 'none'; $('#parade').appendChild(img); return img;
  }));
  await Promise.all(['500', '600', '700', '800', '900'].map((w) => document.fonts.load(`${w} 40px "Inter Tight"`)));
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  // Card heights are known once fonts are in.
  for (const h of C.cards) h.h = h.el.getBoundingClientRect().height;
  return true;
};

const zoomAt = (t) => {
  for (const z of C.zooms) {
    if (t < z.t0 || t > z.t1) continue;
    const e = Math.min(easeInOut(clamp((t - z.t0) / 0.4)), easeInOut(clamp((z.t1 - t) / 0.4)));
    return { k: 1 + 0.25 * e, f: local(z.fx, z.fy) };
  }
  return { k: 1, f: [0, 0] };
};
// Raw device px -> stage px, through the current zoom.
const toStage = (dx, dy, zoom) => {
  let [x, y] = local(dx, dy);
  if (zoom.k !== 1) { x = zoom.f[0] + (x - zoom.f[0]) * zoom.k; y = zoom.f[1] + (y - zoom.f[1]) * zoom.k; }
  return [PX + x, PY + y];
};
const kf = (keys, t) => {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, x0, y0] = keys[i - 1], [t1, x1, y1] = keys[i]; const p = (t - t0) / (t1 - t0);
    return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p];
  }
  return keys.at(-1).slice(1);
};

let lastSrc = {};
const setSrc = async (id, src) => {
  if (lastSrc[id] === src) return;
  const img = document.getElementById(id); lastSrc[id] = src;
  if (!src) { img.removeAttribute('src'); return; }
  img.src = src; await img.decode().catch(() => {});
};

window.frame = async (t, layers) => {
  // Phone: up to two raw-frame layers (a crossfade), mirrored in the zoom layer.
  const L0 = layers[0] || null, L1 = layers[1] || null;
  await Promise.all([setSrc('b0', L0 && L0.src), setSrc('b1', L1 && L1.src), setSrc('z0', L0 && L0.src), setSrc('z1', L1 && L1.src)]);
  $('#b0').style.opacity = $('#z0').style.opacity = L0 ? 1 : 0;
  $('#b1').style.opacity = $('#z1').style.opacity = L1 ? L1.op : 0;
  const zoom = zoomAt(t);
  $('#zoomclip').style.display = zoom.k > 1.0005 ? 'block' : 'none';
  $('#zoominner').style.transformOrigin = `${zoom.f[0]}px ${zoom.f[1]}px`;
  $('#zoominner').style.transform = `scale(${zoom.k})`;
  // Phone in/out under the doodle wipes.
  const ph = C.phone;
  $('#phone').style.opacity = clamp(Math.min((t - ph.in) / 0.12, (ph.out - t) / 0.12));

  // Scene pills: the first slides in; later ones cross-fade; the last fades with the end wipe.
  C.pills.forEach((p, i) => {
    let op = 0, dx = 0;
    if (t >= p.t0 - 0.15 && t < p.t1 + 0.25) {
      // Between scenes the old words fade out, then the new ones fade in (no overlap).
      const first = i === 0;
      const pin = first ? clamp((t - p.t0) / 0.25) : clamp((t - p.t0) / 0.15);
      const pout = i === C.pills.length - 1 ? clamp((t - p.t1) / 0.2) : clamp((t - p.t1 + 0.15) / 0.15);
      op = Math.min(first ? clamp(pin * 2) : pin, 1 - pout);
      dx = first ? 60 * (1 - easeOut(pin)) : 0;
    }
    p.el.style.opacity = op;
    p.el.style.transform = `translate(${dx}px, -50%)`;
  });

  // Headline cards.
  for (const h of C.cards) {
    if (t < h.t0 || t > h.t1 + 0.2) { h.el.style.opacity = 0; continue; }
    const pin = clamp((t - h.t0) / 0.25), pout = clamp((t - h.t1) / 0.2);
    const scale = 0.92 + 0.08 * easeBack(pin);
    const y = 430 - h.h / 2 + 24 * (1 - easeOut(pin)) + 16 * pout;
    h.el.style.top = y + 'px';
    h.el.style.opacity = Math.min(clamp(pin * 3), 1 - pout);
    h.el.style.transform = `scale(${scale})`;
    h.el.style.transformOrigin = '30% 50%';
    const off = 14 * easeOut(clamp((t - h.t0 - 0.1) / 0.25));
    h.el.querySelector('.block').style.transform = `translate(${off}px, ${off}px)`;
    if (h.sparks) {
      const st = t - h.t0 - 0.2;
      const W = 720, H = h.h;
      for (const { s, ax, ay, sc } of h.sparks) {
        const vis = st >= 0 && st <= 0.45;
        const k = vis ? (st < 0.15 ? easeBack(st / 0.15) : 1) * sc * 1.2 : 0;
        const x = ax < 0 ? ax : W + 14 + ax * 4, y2 = ay < 0 ? ay : H + 14 + ay * 4;
        s.style.left = (x - 17) + 'px'; s.style.top = (y2 - 17) + 'px';
        s.style.opacity = vis ? clamp((0.45 - st) / 0.12) : 0;
        s.style.transform = `scale(${k}) rotate(${st * 60}deg)`;
      }
    }
  }

  // Voice subtitle: words appear with the voice.
  const v = C.voices.find((x) => t >= x.t0 - 0.2 && t <= x.t1 + 0.25);
  const bub = $('#bubble');
  if (v) {
    if (bub.dataset.id !== v.id) {
      bub.dataset.id = v.id;
      $('#btext').innerHTML = v.words.map((w, i) => `<span class="w">${i === 0 ? '“' : ''}${w.w}${i === v.words.length - 1 ? '”' : ''}</span>`).join(' ');
    }
    const pin = clamp((t - v.t0) / 0.2), pout = clamp((t - v.t1) / 0.2);
    bub.style.opacity = Math.min(pin, 1 - pout);
    bub.style.transform = `scale(${0.94 + 0.06 * easeBack(pin)}) translateY(${12 * pout}px)`;
    [...bub.querySelectorAll('.w')].forEach((el, i) => { el.style.opacity = clamp((t - v.t0 - v.words[i].start + 0.04) / 0.1); });
  } else bub.style.opacity = 0;

  // Pointer tags: line draws to the detail, then the tag pops in.
  for (const d of C.tags) {
    const on = t >= d.t0 && t <= d.t1 + 0.2;
    if (!on) { d.el.style.opacity = 0; d.line.setAttribute('opacity', 0); d.dot.setAttribute('opacity', 0); continue; }
    const [dx, dy] = kf(d.keys, t);
    const [tx, ty] = toStage(dx, dy, zoom);
    const p = easeOut(clamp((t - d.t0) / 0.2)), pout = clamp((t - d.t1) / 0.2);
    const x0 = 868;
    d.line.setAttribute('x1', x0); d.line.setAttribute('y1', ty);
    d.line.setAttribute('x2', x0 + (tx - x0) * p); d.line.setAttribute('y2', ty);
    d.line.setAttribute('opacity', 1 - pout);
    const dotK = clamp((t - d.t0 - 0.17) / 0.1);
    d.dot.setAttribute('cx', tx); d.dot.setAttribute('cy', ty); d.dot.setAttribute('opacity', dotK * (1 - pout));
    const tp = clamp((t - d.t0 - 0.2) / 0.15);
    d.el.style.top = ty + 'px';
    d.el.style.opacity = Math.min(tp, 1 - pout);
    d.el.style.transform = `translateY(-50%) scale(${0.85 + 0.15 * easeBack(tp)})`;
    d.el.style.transformOrigin = '0 50%';
  }

  // Click rings.
  let rings = '';
  for (const c of C.clicks) {
    const a = (t - c.t) / 0.3;
    if (a < 0 || a > 1) continue;
    const [x, y] = toStage(c.dx, c.dy, zoom);
    const r = 10 + 16 * easeOut(a), op = 1 - a;
    rings += `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#10372B" stroke-width="12" opacity="${op}"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#C6E34A" stroke-width="6" opacity="${op}"/>`;
  }
  $('#rings').innerHTML = rings;

  // Title card.
  const ti = $('#title');
  ti.style.opacity = clamp((C.titleOut - t) / 0.15);
  ti.style.display = t < C.titleOut + 0.2 ? 'block' : 'none';
  if (t < C.titleOut + 0.2) cardBuild(ti, t, 0, 0.4, 0.8, null);
  // End card.
  const en = $('#endc');
  en.style.display = t >= C.endIn - 0.2 ? 'block' : 'none';
  if (t >= C.endIn - 0.2) cardBuild(en, t, C.endIn, C.endIn + 0.4, C.endPill, C.endUrl);

  // Doodle parades (the cut happens behind them).
  C.parades.forEach((w, k) => {
    const els = C.paradeEls[k];
    els.forEach((img, i) => {
      const p = (t - w.t0 - i * 0.045) / 0.75;
      if (p < 0 || p > 1) { img.style.display = 'none'; return; }
      const size = w.sizes[i];
      const x = -340 + p * (1920 + 680);
      const phase = 2 * Math.PI * 1.5 * p + w.phase[i];
      const y = 540 + 190 * Math.sin(phase) - size / 2 + w.dy[i];
      const tilt = Math.atan(190 * 2 * Math.PI * 1.5 / 2600 * Math.cos(phase)) * 0.8;
      img.style.display = 'block';
      img.style.width = img.style.height = size + 'px';
      img.style.left = x + 'px'; img.style.top = y + 'px';
      img.style.transform = `rotate(${tilt}rad)`;
    });
  });

  $('#fade').style.opacity = clamp((t - C.fadeAt) / 1.0);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};

function cardBuild(root, t, tBadge, tWord, tPill, tUrl) {
  const b = root.querySelector('.badge'), w = root.querySelector('.word'), p = root.querySelector('.tpill'), u = root.querySelector('.upill');
  const pb = clamp((t - tBadge) / 0.35);
  b.style.opacity = clamp(pb * 2.5);
  b.style.transform = `scale(${0.8 + 0.2 * easeBack(pb)}) rotate(${-10 * (1 - easeOut(pb))}deg)`;
  const pw = clamp((t - tWord) / 0.3);
  w.style.opacity = pw; w.style.transform = `translateY(${24 * (1 - easeOut(pw))}px)`;
  const pp = clamp((t - tPill) / 0.25);
  p.style.opacity = pp; p.style.transform = `translateX(calc(-50% + ${60 * (1 - easeOut(pp))}px))`;
  if (u) { const pu = clamp((t - tUrl) / 0.25); u.style.opacity = pu; u.style.transform = `translateX(-50%) scale(${0.85 + 0.15 * easeBack(pu)})`; }
}
</script>
</body>
</html>
